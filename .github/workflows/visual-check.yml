name: Octopus Dashboard Visual Check

on:
  workflow_dispatch:
  push:
    paths:
      - "web/index.html"
      - "web/market-data.js"
      - ".github/workflows/visual-check.yml"

permissions:
  contents: read

jobs:
  visual-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-save playwright@1.56.1
          fi
          npx playwright install chromium

      - name: Start local dashboard server
        run: |
          python3 -m http.server 8000 --directory web > /tmp/octopus-http.log 2>&1 &
          for i in $(seq 1 10); do curl -fsS http://127.0.0.1:8000/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/octopus-http.log
          exit 1

      - name: Verify live Bitget public market data (read-only)
        run: |
          node <<'NODE'
          const checks = [
            { symbol: 'BTCUSDT', provider: 'Bitget USDT-FUTURES', url: 'https://api.bitget.com/api/v2/mix/market/ticker?productType=USDT-FUTURES&symbol=BTCUSDT', price: p => Number((Array.isArray(p.data) ? p.data[0] : p.data)?.lastPr || (Array.isArray(p.data) ? p.data[0] : p.data)?.last), valid: p => p.code === '00000' && !!(Array.isArray(p.data) ? p.data[0] : p.data) },
            { symbol: 'HYPEUSDT', provider: 'Bitget USDT-FUTURES', url: 'https://api.bitget.com/api/v2/mix/market/ticker?productType=USDT-FUTURES&symbol=HYPEUSDT', price: p => Number((Array.isArray(p.data) ? p.data[0] : p.data)?.lastPr || (Array.isArray(p.data) ? p.data[0] : p.data)?.last), valid: p => p.code === '00000' && !!(Array.isArray(p.data) ? p.data[0] : p.data) },
            ...['NVDAUSDT', 'TSLAUSDT', 'AAPLUSDT', 'XAUUSDT', 'CLUSDT'].map(symbol => ({ symbol, provider: 'Bitget USDT-FUTURES', url: 'https://api.bitget.com/api/v2/mix/market/ticker?productType=USDT-FUTURES&symbol=' + symbol, price: p => Number((Array.isArray(p.data) ? p.data[0] : p.data)?.lastPr || (Array.isArray(p.data) ? p.data[0] : p.data)?.last), valid: p => p.code === '00000' && !!(Array.isArray(p.data) ? p.data[0] : p.data) }))
          ];
          (async () => {
            for (const check of checks) {
              const response = await fetch(check.url, { signal: AbortSignal.timeout(12000) });
              if (!response.ok) throw new Error(check.symbol + ' HTTP ' + response.status);
              const payload = await response.json();
              if (!check.valid(payload)) throw new Error(check.symbol + ' invalid response: ' + JSON.stringify(payload).slice(0, 300));
              const price = check.price(payload);
              if (!Number.isFinite(price) || price <= 0) throw new Error(check.symbol + ' invalid price');
              const rawTime = Number(payload.data[0].ts);
              console.log('LIVE PUBLIC QUOTE READ-ONLY ' + JSON.stringify({ symbol: check.symbol, price, timestamp: Number.isFinite(rawTime) && rawTime > 0 ? new Date(rawTime).toISOString() : 'provider timestamp unavailable', source: check.provider, tradingEnabled: false }));
            }
            console.log('ALL SEVEN LIVE PUBLIC QUOTES CHECK PASSED');
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Verify browser-side Bitget access from dashboard origin
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            const failures = [];
            page.on('pageerror', error => failures.push(error.message));
            await page.goto('http://127.0.0.1:8000/index.html', { waitUntil: 'domcontentloaded', timeout: 10000 });
            const result = await page.evaluate(async () => {
              const checks = [
                { symbol: 'BTC', url: 'https://api.bitget.com/api/v2/mix/market/ticker?productType=USDT-FUTURES&symbol=BTCUSDT', price: p => Number((Array.isArray(p.data) ? p.data[0] : p.data)?.lastPr || (Array.isArray(p.data) ? p.data[0] : p.data)?.last), valid: p => p.code === '00000' && !!(Array.isArray(p.data) ? p.data[0] : p.data) },
                { symbol: 'HYPE', url: 'https://api.bitget.com/api/v2/mix/market/ticker?productType=USDT-FUTURES&symbol=HYPEUSDT', price: p => Number((Array.isArray(p.data) ? p.data[0] : p.data)?.lastPr || (Array.isArray(p.data) ? p.data[0] : p.data)?.last), valid: p => p.code === '00000' && !!(Array.isArray(p.data) ? p.data[0] : p.data) },
                ...['NVDAUSDT', 'TSLAUSDT', 'AAPLUSDT', 'XAUUSDT', 'CLUSDT'].map(symbol => ({ symbol, url: 'https://api.bitget.com/api/v2/mix/market/ticker?productType=USDT-FUTURES&symbol=' + symbol, price: p => Number((Array.isArray(p.data) ? p.data[0] : p.data)?.lastPr || (Array.isArray(p.data) ? p.data[0] : p.data)?.last), valid: p => p.code === '00000' && !!(Array.isArray(p.data) ? p.data[0] : p.data) }))
              ];
              const out = [];
              for (const check of checks) {
                try {
                  const response = await fetch(check.url, { cache: 'no-store', signal: AbortSignal.timeout(12000) });
                  const payload = await response.json();
                  const price = check.price(payload);
                  out.push({ symbol: check.symbol, ok: response.ok && check.valid(payload) && Number.isFinite(price) && price > 0, status: response.status, price: Number.isFinite(price) ? price : null });
                } catch (error) {
                  out.push({ symbol: check.symbol, ok: false, error: String(error && error.message || error) });
                }
              }
              return out;
            });
            console.log('BROWSER BITGET ACCESS ' + JSON.stringify(result));
            if (failures.length) throw new Error('Browser page errors: ' + failures.join('; '));
            if (result.some(item => !item.ok)) throw new Error('Browser cannot read all seven public quotes; investigate provider/CORS/network restrictions.');
            await browser.close();
            console.log('BROWSER-SIDE ALL SEVEN QUOTES PASSED');
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Render dashboard at desktop and iPad landscape sizes
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('node:fs');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ deviceScaleFactor: 1 });
            const fileUrl = 'http://127.0.0.1:8000/index.html';
            const cases = [
              { name: 'desktop-1440x900', width: 1440, height: 900 },
              { name: 'ipad-landscape-1180x820', width: 1180, height: 820 },
              { name: 'ipad-landscape-1366x1024', width: 1366, height: 1024 }
            ];
            const failures = [];
            fs.mkdirSync('visual-artifacts', { recursive: true });

            await page.goto(fileUrl, { waitUntil: 'domcontentloaded' });
            for (const c of cases) {
              await page.setViewportSize({ width: c.width, height: c.height });
              await page.screenshot({
                path: `visual-artifacts/${c.name}.png`,
                fullPage: true,
                animations: 'disabled'
              });
              const result = await page.evaluate(() => {
                const selectors = ['.app', 'header', '.field', '.brain-wrap', '#brain', '.markets', 'footer', '.quote', '.spark'];
                const missingCoreSections = selectors.filter(s => !document.querySelector(s));
                const markets = document.querySelector('.markets')?.getBoundingClientRect();
                const cards = [...document.querySelectorAll('.quote')].map(el => ({symbol: el.dataset.symbol, hasPrice: !!el.querySelector('.price'), insideMarkets: !!markets && el.getBoundingClientRect().left >= markets.left - 1 && el.getBoundingClientRect().right <= markets.right + 1}));
                return { viewport: { width: innerWidth, height: innerHeight }, documentWidth: document.documentElement.scrollWidth, horizontalOverflow: document.documentElement.scrollWidth > innerWidth, missingCoreSections, marketCards: cards };
              });
              console.log(JSON.stringify({ case: c.name, ...result }, null, 2));
              if (result.horizontalOverflow) failures.push(`${c.name}: horizontal overflow`);
              if (result.missingCoreSections.length) failures.push(`${c.name}: missing sections ${result.missingCoreSections.join(', ')}`);
              if (result.marketCards.length !== 7) failures.push(`${c.name}: expected 7 market cards, found ${result.marketCards.length}`);
              const missingPrices = result.marketCards.filter(n => !n.hasPrice);
              if (missingPrices.length) failures.push(`${c.name}: cards missing price elements: ${missingPrices.map(n => n.symbol).join(', ')}`);
            }
            await browser.close();
            if (failures.length) { console.error('VISUAL CHECK FAILED:\\n' + failures.join('\\n')); process.exit(1); }
            console.log('VISUAL CHECK PASSED');
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Verify quote status quickly
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            const errors = [];
            page.on('pageerror', e => errors.push('pageerror: ' + e.message));
            await page.goto('http://127.0.0.1:8000/index.html', { waitUntil: 'domcontentloaded', timeout: 10000 });
            await page.waitForFunction(() => { const status = document.querySelector('#global-status')?.textContent || ''; const updated = document.querySelector('#updated')?.textContent || ''; return !/正在连接/.test(status) && /最近检查/.test(updated); }, { timeout: 20000 });
            const state = await page.evaluate(() => ({
              status: document.querySelector('#global-status')?.textContent,
              lastUpdated: document.querySelector('#updated')?.textContent,
              quotes: Object.fromEntries([...document.querySelectorAll('.quote[data-symbol]')].map(el => [el.dataset.symbol, el.querySelector('.price')?.textContent.trim()]))
            }));
            console.log(JSON.stringify({state, errors}, null, 2));
            await browser.close();
            if (errors.length) process.exit(1);
            const symbols = ['BTC', 'HYPE', 'NVDA', 'TSLA', 'AAPL', 'XAU', 'CL'];
            const missing = symbols.filter(symbol => !(symbol in state.quotes));
            if (missing.length) { console.error('Missing quote nodes: ' + missing.join(', ')); process.exit(1); }
            if (!state.status || /正在连接/.test(state.status) || !state.lastUpdated || !/最近检查/.test(state.lastUpdated)) {
              console.error('Market status or refresh timestamp did not update.'); process.exit(1);
            }
            console.log('QUOTE HEALTH REPORT ' + JSON.stringify(symbols.map(symbol => ({symbol, displayed: state.quotes[symbol], configuredForLiveData: ['BTC', 'HYPE'].includes(symbol)}))));
          })().catch(e => { console.error(e); process.exit(1); });
          NODE

      - name: Verify quote outage and recovery
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            const errors = [];
            page.on('pageerror', error => errors.push(error.message));
            let mode = 'outage';
            const requests = { bitget: 0, recoveryBitget: 0 };

            // Accelerate the dashboard polling for this automated test only.
            await page.addInitScript(() => {
              const original = window.setInterval.bind(window);
              window.setInterval = (fn, delay, ...args) =>
                original(fn, delay === 15000 ? 250 : delay, ...args);
            });

            await page.route('https://api.bitget.com/**', async route => {
              requests.bitget++;
              if (mode === 'outage') return route.abort('failed');
              requests.recoveryBitget++;
              const symbol = new URL(route.request().url()).searchParams.get('symbol');
              const price = symbol === 'HYPEUSDT' ? 9.99 : 65000;
              const now = Date.now();
              const candles = Array.from({ length: 60 }, (_, i) => {
                const close = price * (0.995 + i * (0.005 / 59));
                return [String(now - (59 - i) * 900000), String(close * 0.999), String(close * 1.002), String(close * 0.998), String(close), '100'];
              }).reverse();
              return route.fulfill({
                status: 200,
                contentType: 'application/json',
                body: JSON.stringify({ code: '00000', data: candles })
              });
            });

            await page.goto('http://127.0.0.1:8000/index.html', { waitUntil: 'domcontentloaded', timeout: 10000 });

            await page.waitForFunction(() => {
              const status = document.querySelector('#global-status')?.textContent || '';
              const btcPrice = document.querySelector('.quote[data-symbol="BTC"] .price')?.textContent.trim();
              const btcStatus = document.querySelector('.quote[data-symbol="BTC"] .quote-status')?.textContent || '';
              return btcPrice === '—' && /行情连接异常/.test(status) && /连接失败/.test(btcStatus);
            }, null, { timeout: 20000 });

            const outage = await page.evaluate(() => ({
              status: document.querySelector('#global-status')?.textContent,
              btc: document.querySelector('.quote[data-symbol="BTC"] .price')?.textContent.trim(),
              btcStatus: document.querySelector('.quote[data-symbol="BTC"] .quote-status')?.textContent,
              updated: document.querySelector('#updated')?.textContent
            }));
            console.log('OUTAGE REPORT ' + JSON.stringify(outage));
            if (requests.bitget < 1) throw new Error('Outage simulation did not intercept Bitget requests');

            mode = 'recovery';

            await page.waitForFunction(() => {
              const status = document.querySelector('#global-status')?.textContent || '';
              const btcPrice = document.querySelector('.quote[data-symbol="BTC"] .price')?.textContent.trim();
              const hypePrice = document.querySelector('.quote[data-symbol="HYPE"] .price')?.textContent.trim();
              const btcStatus = document.querySelector('.quote[data-symbol="BTC"] .quote-status')?.textContent || '';
              return /公开行情已连接/.test(status) && btcPrice !== '—' && hypePrice !== '—' && /BITGET/.test(btcStatus);
            }, null, { timeout: 20000 });

            const recovered = await page.evaluate(() => ({
              status: document.querySelector('#global-status')?.textContent,
              btc: document.querySelector('.quote[data-symbol="BTC"] .price')?.textContent.trim(),
              hype: document.querySelector('.quote[data-symbol="HYPE"] .price')?.textContent.trim(),
              updated: document.querySelector('#updated')?.textContent
            }));
            console.log('RECOVERY REPORT ' + JSON.stringify(recovered));
            console.log('REQUEST COUNTS ' + JSON.stringify(requests));

            if (requests.recoveryBitget < 2) {
              throw new Error('Recovery mocks were not hit for both configured live symbols: ' + JSON.stringify(requests));
            }
            if (errors.length) throw new Error('Browser page errors: ' + errors.join('; '));
            await browser.close();
            console.log('OUTAGE AND RECOVERY CHECK PASSED');
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Upload screenshots and layout logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: octopus-dashboard-visual-check
          path: visual-artifacts/
          if-no-files-found: warn
          retention-days: 14
