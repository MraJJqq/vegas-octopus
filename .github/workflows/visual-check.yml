name: Octopus Dashboard Visual Check

on:
  workflow_dispatch:
  push:
    paths:
      - "web/index.html"
      - "web/market-data.js"
      - ".github/workflows/visual-check.yml"

permissions:
  contents: read

jobs:
  visual-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-save playwright@1.56.1
          fi
          npx playwright install chromium

      - name: Start local dashboard server
        run: |
          python3 -m http.server 8000 --directory web > /tmp/octopus-http.log 2>&1 &
          for i in $(seq 1 10); do curl -fsS http://127.0.0.1:8000/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/octopus-http.log
          exit 1

      - name: Verify live Bitget public market data (read-only)
        run: |
          node <<'NODE'
          const symbols = ['BTCUSDT', 'HYPEUSDT'];
          (async () => {
            for (const symbol of symbols) {
              const url = 'https://api.bitget.com/api/v2/spot/market/tickers?symbol=' + encodeURIComponent(symbol);
              const response = await fetch(url, { signal: AbortSignal.timeout(12000) });
              if (!response.ok) throw new Error(symbol + ' HTTP ' + response.status);
              const payload = await response.json();
              if (payload.code !== '00000' || !Array.isArray(payload.data) || !payload.data[0]) {
                throw new Error(symbol + ' Bitget response invalid: ' + JSON.stringify(payload).slice(0, 300));
              }
              const row = payload.data[0];
              const price = Number(row.lastPr);
              const timestamp = Number(row.ts);
              if (!Number.isFinite(price) || price <= 0 || !Number.isFinite(timestamp) || timestamp <= 0) {
                throw new Error(symbol + ' invalid price/timestamp');
              }
              console.log('BITGET LIVE READ-ONLY ' + JSON.stringify({
                symbol,
                price,
                timestamp: new Date(timestamp).toISOString(),
                source: 'Bitget public spot API',
                tradingEnabled: false
              }));
            }
            console.log('LIVE BITGET PUBLIC MARKET DATA CHECK PASSED');
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Render dashboard at desktop and iPad landscape sizes
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('node:fs');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ deviceScaleFactor: 1 });
            const fileUrl = 'http://127.0.0.1:8000/index.html';
            const cases = [
              { name: 'desktop-1440x900', width: 1440, height: 900 },
              { name: 'ipad-landscape-1180x820', width: 1180, height: 820 },
              { name: 'ipad-landscape-1366x1024', width: 1366, height: 1024 }
            ];
            const failures = [];
            fs.mkdirSync('visual-artifacts', { recursive: true });

            await page.goto(fileUrl, { waitUntil: 'domcontentloaded' });
            for (const c of cases) {
              await page.setViewportSize({ width: c.width, height: c.height });
              await page.screenshot({
                path: `visual-artifacts/${c.name}.png`,
                fullPage: true,
                animations: 'disabled'
              });
              const result = await page.evaluate(() => {
                const selectors = ['.topbar', '.metrics', '.stage', '.arena', '.side', '.bottom-grid', '.footer', '.creature', '.market-node'];
                const missingCoreSections = selectors.filter(s => !document.querySelector(s));
                const arena = document.querySelector('.arena')?.getBoundingClientRect();
                const nodes = [...document.querySelectorAll('.market-node')].map(el => {
                  const r = el.getBoundingClientRect();
                  return { name: el.querySelector('.sym')?.textContent?.trim(), insideArena: !!arena && r.left >= arena.left - 1 && r.right <= arena.right + 1 && r.top >= arena.top - 1 && r.bottom <= arena.bottom + 1 };
                });
                return { viewport: { width: innerWidth, height: innerHeight }, documentWidth: document.documentElement.scrollWidth, horizontalOverflow: document.documentElement.scrollWidth > innerWidth, missingCoreSections, arenaNodesInside: nodes };
              });
              console.log(JSON.stringify({ case: c.name, ...result }, null, 2));
              if (result.horizontalOverflow) failures.push(`${c.name}: horizontal overflow`);
              if (result.missingCoreSections.length) failures.push(`${c.name}: missing sections ${result.missingCoreSections.join(', ')}`);
              const outside = result.arenaNodesInside.filter(n => !n.insideArena);
              if (outside.length) failures.push(`${c.name}: market nodes outside arena: ${outside.map(n => n.name).join(', ')}`);
            }
            await browser.close();
            if (failures.length) { console.error('VISUAL CHECK FAILED:\\n' + failures.join('\\n')); process.exit(1); }
            console.log('VISUAL CHECK PASSED');
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Verify quote status quickly
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            const errors = [];
            page.on('pageerror', e => errors.push('pageerror: ' + e.message));
            await page.goto('http://127.0.0.1:8000/index.html', { waitUntil: 'domcontentloaded', timeout: 10000 });
            await page.waitForFunction(() => {
              const status = document.querySelector('#market-data-status')?.textContent || '';
              return /LIVE FEED|PARTIAL FEED|FEED UNAVAILABLE/.test(status);
            }, { timeout: 6000 }).catch(() => {});
            const state = await page.evaluate(() => ({
              status: document.querySelector('#market-data-status')?.textContent,
              lastUpdated: document.querySelector('#market-last-updated')?.textContent,
              quotes: Object.fromEntries([...document.querySelectorAll('[data-quote]')].map(el => [el.dataset.quote, el.textContent.trim()]))
            }));
            console.log(JSON.stringify({state, errors}, null, 2));
            await browser.close();
            if (errors.length) process.exit(1);
            const symbols = ['BTC', 'HYPE', 'NVDA', 'TSLA', 'AAPL', 'XAU', 'CL'];
            const missing = symbols.filter(symbol => !(symbol in state.quotes));
            if (missing.length) { console.error('Missing quote nodes: ' + missing.join(', ')); process.exit(1); }
            if (!state.status || !state.lastUpdated || !/最近检查/.test(state.lastUpdated)) {
              console.error('Market status or refresh timestamp did not update.'); process.exit(1);
            }
            console.log('QUOTE HEALTH REPORT ' + JSON.stringify(symbols.map(symbol => ({symbol, displayed: state.quotes[symbol], unavailable: /暂不可用/.test(state.quotes[symbol])}))));
          })().catch(e => { console.error(e); process.exit(1); });
          NODE

      - name: Verify quote outage and recovery
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            const errors = [];
            page.on('pageerror', error => errors.push(error.message));
            let mode = 'outage';
            const requests = { bitget: 0, yahoo: 0, recoveryBitget: 0, recoveryYahoo: 0 };

            // Accelerate the dashboard's 30-second polling for this automated test only.
            await page.addInitScript(() => {
              const original = window.setInterval.bind(window);
              window.setInterval = (fn, delay, ...args) =>
                original(fn, delay === 30000 ? 250 : delay, ...args);
            });

            await page.route('https://api.bitget.com/**', async route => {
              requests.bitget++;
              if (mode === 'outage') return route.abort('failed');
              requests.recoveryBitget++;
              const symbol = new URL(route.request().url()).searchParams.get('symbol');
              const price = symbol === 'HYPEUSDT' ? '9.99' : '65000';
              return route.fulfill({
                status: 200,
                contentType: 'application/json',
                body: JSON.stringify({ code: '00000', data: [{ lastPr: price, ts: String(Date.now()) }] })
              });
            });

            await page.route('https://query*.finance.yahoo.com/**', async route => {
              requests.yahoo++;
              if (mode === 'outage') return route.abort('failed');
              requests.recoveryYahoo++;
              return route.fulfill({
                status: 200,
                contentType: 'application/json',
                body: JSON.stringify({
                  chart: { result: [{ meta: { regularMarketPrice: 123.45, regularMarketTime: Math.floor(Date.now() / 1000) } }] }
                })
              });
            });

            await page.goto('http://127.0.0.1:8000/index.html', { waitUntil: 'domcontentloaded', timeout: 10000 });

            await page.waitForFunction(() => {
              const status = document.querySelector('#market-data-status')?.textContent || '';
              const btc = document.querySelector('[data-quote="BTC"]')?.textContent.trim();
              return btc === '暂不可用' && /FEED UNAVAILABLE/.test(status);
            }, null, { timeout: 20000 });

            const outage = await page.evaluate(() => ({
              status: document.querySelector('#market-data-status')?.textContent,
              btc: document.querySelector('[data-quote="BTC"]')?.textContent.trim(),
              updated: document.querySelector('#market-last-updated')?.textContent
            }));
            console.log('OUTAGE REPORT ' + JSON.stringify(outage));
            if (requests.bitget < 1) throw new Error('Outage simulation did not intercept Bitget requests');

            mode = 'recovery';

            // Run the same production tick function by waiting for the accelerated next poll.
            // HYPE uses four decimal places in the dashboard, so expect 9.9900.
            await page.waitForFunction(() => {
              const status = document.querySelector('#market-data-status')?.textContent || '';
              const btc = document.querySelector('[data-quote="BTC"]')?.textContent.trim();
              const hype = document.querySelector('[data-quote="HYPE"]')?.textContent.trim();
              return /LIVE FEED/.test(status) && btc === '65,000.00' && hype === '9.9900';
            }, null, { timeout: 20000 });

            const recovered = await page.evaluate(() => ({
              status: document.querySelector('#market-data-status')?.textContent,
              btc: document.querySelector('[data-quote="BTC"]')?.textContent.trim(),
              hype: document.querySelector('[data-quote="HYPE"]')?.textContent.trim(),
              updated: document.querySelector('#market-last-updated')?.textContent
            }));
            console.log('RECOVERY REPORT ' + JSON.stringify(recovered));
            console.log('REQUEST COUNTS ' + JSON.stringify(requests));

            if (requests.recoveryBitget < 2 || requests.recoveryYahoo < 5) {
              throw new Error('Recovery mocks were not hit for all expected public-feed requests: ' + JSON.stringify(requests));
            }
            if (errors.length) throw new Error('Browser page errors: ' + errors.join('; '));
            await browser.close();
            console.log('OUTAGE AND RECOVERY CHECK PASSED');
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Upload screenshots and layout logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: octopus-dashboard-visual-check
          path: visual-artifacts/
          if-no-files-found: warn
          retention-days: 14
