name: Sync read-only V9 signal feed

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-v9-signal-feed
  cancel-in-progress: false

jobs:
  sync-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout dashboard repository
        uses: actions/checkout@v4

      - name: Read private V9 signal state and normalize
        env:
          SOURCE_URL: https://api.github.com/repos/MraJJqq/vegas-signal-system/contents/v9/.signal-state.json?ref=main
          SOURCE_TOKEN: ${{ secrets.V9_READ_TOKEN }}
        run: |
          python - <<'PY'
          import base64, json, os, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          token = os.environ.get("SOURCE_TOKEN", "").strip()
          if not token:
              raise SystemExit("Missing repository secret V9_READ_TOKEN. Add a read-only token for MraJJqq/vegas-signal-system.")

          request = urllib.request.Request(
              os.environ["SOURCE_URL"],
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + token,
                  "User-Agent": "vegas-octopus-readonly-signal-sync",
                  "X-GitHub-Api-Version": "2022-11-28"
              }
          )
          with urllib.request.urlopen(request, timeout=15) as response:
              api_file = json.load(response)

          encoded = api_file.get("content", "")
          source = json.loads(base64.b64decode(encoded).decode("utf-8"))
          block = source.get("__daily_formal_signals__", {})
          latest_by_symbol = {}
          for signal in block.get("signals", []):
              if not isinstance(signal, dict) or not signal.get("formal_signal"):
                  continue
              if not signal.get("symbol") or not signal.get("candle_timestamp_ms"):
                  continue
              item = {
                  "formal_signal": True,
                  "symbol": str(signal["symbol"]),
                  "timeframe": str(signal.get("timeframe") or "1H"),
                  "line": str(signal.get("line") or "Vegas触发"),
                  "filter_line": str(signal.get("filter_line") or "EMA12"),
                  "filter_side": str(signal.get("filter_side") or "已确认"),
                  "close_price": signal.get("close_price"),
                  "candle_timestamp_ms": int(signal["candle_timestamp_ms"])
              }
              previous = latest_by_symbol.get(item["symbol"])
              if previous is None or item["candle_timestamp_ms"] > previous["candle_timestamp_ms"]:
                  latest_by_symbol[item["symbol"]] = item

          valid = sorted(
              latest_by_symbol.values(),
              key=lambda item: item["candle_timestamp_ms"],
              reverse=True
          )
          output = {
              "connected": True,
              "source": "MraJJqq/vegas-signal-system v9 read-only state",
              "source_sha": api_file.get("sha"),
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "signal_date": block.get("date"),
              "signals": valid
          }
          Path("web/signal-state.json").write_text(
              json.dumps(output, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          print(f"Synced {len(valid)} latest-per-symbol formal signals for {output['signal_date']}")
          PY

      - name: Commit refreshed signal feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/signal-state.json
          if git diff --cached --quiet; then
            echo "Signal feed unchanged."
          else
            git commit -m "chore: sync read-only V9 signal feed"
            git push
          fi
