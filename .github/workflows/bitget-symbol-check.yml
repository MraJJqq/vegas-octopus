name: Bitget Symbol Verification
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/bitget-symbol-check.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Bitget USDT futures instruments and live tickers
        run: |
          node <<'NODE'
          const symbols = ['NVDAUSDT', 'TSLAUSDT', 'AAPLUSDT', 'XAUUSDT', 'CLUSDT'];
          async function get(url) {
            const res = await fetch(url, { signal: AbortSignal.timeout(12000) });
            const body = await res.json().catch(() => ({}));
            return { status: res.status, body };
          }
          (async () => {
            const contracts = await get('https://api.bitget.com/api/v2/mix/market/contracts?productType=USDT-FUTURES');
            if (contracts.status !== 200 || contracts.body.code !== '00000' || !Array.isArray(contracts.body.data)) {
              throw new Error('Unable to retrieve Bitget USDT futures contract list: ' + JSON.stringify(contracts.body).slice(0, 500));
            }
            const available = new Map(contracts.body.data.map(x => [String(x.symbol).toUpperCase(), x]));
            let failures = 0;
            for (const symbol of symbols) {
              const instrument = available.get(symbol);
              if (!instrument) {
                failures++;
                console.log('VERIFY RESULT ' + JSON.stringify({ symbol, productType: 'USDT-FUTURES', listed: false, liveTicker: false, conclusion: 'NOT LISTED in returned USDT futures instruments' }));
                continue;
              }
              const ticker = await get('https://api.bitget.com/api/v2/mix/market/ticker?productType=USDT-FUTURES&symbol=' + symbol);
              const row = Array.isArray(ticker.body.data) ? ticker.body.data[0] : ticker.body.data;
              const price = Number(row?.lastPr);
              const ok = ticker.status === 200 && ticker.body.code === '00000' && Number.isFinite(price) && price > 0;
              if (!ok) failures++;
              console.log('VERIFY RESULT ' + JSON.stringify({
                symbol,
                productType: 'USDT-FUTURES',
                listed: true,
                status: instrument.symbolStatus || instrument.symbolStatus,
                liveTicker: ok,
                price: ok ? price : null,
                tickerResponseCode: ticker.body.code || null,
                conclusion: ok ? 'PASS' : 'LISTED BUT TICKER FAILED'
              }));
            }
            console.log('VERIFICATION SUMMARY ' + JSON.stringify({ total: symbols.length, failures }));
            if (failures) process.exitCode = 1;
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
