<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02040b">
<title>VEGAS 章鱼 · OCTOPUS</title>
<style>
:root{color-scheme:dark;--bg:#02040b;--muted:#74839f;--white:#eef6ff;--blue:#52bfff;--gold:#e6c47c;--green:#53e5b4;--purple:#b49aff;--ice:#8beaff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--white);font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif}
body{overflow:hidden;background:radial-gradient(ellipse at 50% 48%,#11182b 0%,#060914 38%,#02040b 76%)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(#91a8cf26 .7px,transparent .7px);background-size:23px 23px;opacity:.3}
#space{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.app{position:relative;z-index:2;width:100%;height:100%;padding:clamp(14px,2vw,30px);display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,28%);grid-template-rows:auto minmax(0,1fr) auto;gap:clamp(10px,1.3vw,20px);max-width:1900px;margin:auto}
header{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:42px}
.brand{display:flex;align-items:center;gap:12px}.mark{width:34px;height:34px;border:1px solid #6f8bc866;border-radius:50%;display:grid;place-items:center;color:#a6c7ff;box-shadow:0 0 22px #6f8bc822;font-size:17px}
.kicker{font-size:9px;letter-spacing:.32em;color:#7e9bbd}.brand h1{font-size:clamp(15px,1.5vw,21px);letter-spacing:.19em;margin:3px 0 0;font-weight:550}.status{font-size:10px;letter-spacing:.1em;color:#93a3bc;display:flex;align-items:center;gap:8px}.dot{width:6px;height:6px;border-radius:50%;background:#7e8da5;display:inline-block}.dot.live{background:#50e1b2;box-shadow:0 0 9px #50e1b2}
.field{position:relative;min-height:0;overflow:hidden;display:grid;place-items:center}
.brain-wrap{position:relative;width:min(68%,min(62vh,650px));aspect-ratio:1;display:grid;place-items:center;isolation:isolate}
.brain-wrap:before{content:"";position:absolute;inset:5%;border-radius:50%;border:1px solid #8b9fff18;box-shadow:inset 0 0 50px #7d79ff09,0 0 70px #6268ff0b;animation:breathe 8s ease-in-out infinite}
.brain-wrap:after{content:"";position:absolute;inset:14%;border-radius:50%;border:1px dashed #78cfff1b;animation:spin 90s linear infinite}
#brain{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 24px #6d8dff24)}
.reserved{position:absolute;left:50%;transform:translateX(-50%);width:min(38%,350px);height:7%;border-top:1px solid #7e9cc51b;border-bottom:1px solid #7e9cc510;opacity:.6}
.reserved.top{top:1%}.reserved.bottom{bottom:1%}
.left-note{position:absolute;left:0;bottom:2%;font-size:9px;letter-spacing:.16em;color:#65738d;line-height:1.8}.left-note b{font-weight:500;color:#b3c6e3}
.markets{min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);align-content:center;gap:clamp(18px,2.2vw,34px) clamp(12px,1.6vw,24px);padding:clamp(14px,2vw,28px) 2px;overflow:auto;scrollbar-width:none}
.quote{position:relative;min-width:0;padding:7px 0 9px;align-self:center;opacity:.95;transition:opacity .35s}
.quote:after{content:"";position:absolute;bottom:0;left:0;width:100%;height:1px;background:linear-gradient(90deg,var(--asset),transparent);opacity:.32}
.quote-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.symbol{font-size:clamp(11px,1vw,14px);letter-spacing:.16em;font-weight:650}.quote-status{font-size:8px;color:#64748b;white-space:nowrap}.price{font-size:clamp(17px,1.7vw,25px);font-weight:450;letter-spacing:-.035em;margin-top:8px;font-variant-numeric:tabular-nums;white-space:nowrap}.change{font-size:10px;color:#f3f7ff;margin-top:4px;font-variant-numeric:tabular-nums}.spark{display:block;width:100%;height:36px;margin-top:9px;overflow:visible}.spark path.line{fill:none;stroke:var(--asset);stroke-width:1.5;vector-effect:non-scaling-stroke}.spark path.glow{fill:none;stroke:var(--asset);stroke-width:5;opacity:.16;filter:blur(3px);vector-effect:non-scaling-stroke}.quote.disconnected .price{color:#738198}.quote.disconnected .spark{opacity:.16}
footer{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:12px;color:#596983;font-size:9px;letter-spacing:.12em;padding-top:8px;border-top:1px solid #90a9d014}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes breathe{0%,100%{transform:scale(.98);opacity:.7}50%{transform:scale(1.02);opacity:1}}
@media(max-width:850px){.app{grid-template-columns:minmax(0,1fr) minmax(220px,40%);padding:14px;gap:10px}.brain-wrap{width:min(85%,52vh)}.markets{gap:16px 12px}.price{font-size:clamp(15px,2.3vw,21px)}.spark{height:30px}}
@media(max-width:650px){body{overflow:auto}.app{height:auto;min-height:100%;grid-template-columns:1fr;grid-template-rows:auto minmax(400px,56vh) auto auto}.field{grid-row:2}.brain-wrap{width:min(76%,48vh)}.markets{grid-template-columns:repeat(2,minmax(0,1fr));grid-row:3;gap:20px 16px;padding:12px 2px}.left-note{font-size:8px}footer{grid-row:4}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<canvas id="space" aria-hidden="true"></canvas>
<main class="app">
<header>
 <div class="brand"><div class="mark">◉</div><div><div class="kicker">LIVE MARKET ORGANISM</div><h1>VEGAS <span style="color:#a7c5ff">章鱼</span></h1></div></div>
 <div class="status"><i class="dot" id="global-dot"></i><span id="global-status">正在连接公开行情</span></div>
</header>
<section class="field" aria-label="中央能量神经大脑与水母动画">
 <div class="reserved top" aria-hidden="true"></div><div class="reserved bottom" aria-hidden="true"></div>
 <div class="brain-wrap"><svg id="brain" viewBox="0 0 600 600" role="img" aria-label="蓝紫色多层神经网络能量大脑"><defs><radialGradient id="core"><stop offset="0" stop-color="#a7c4ff" stop-opacity=".7"/><stop offset=".35" stop-color="#7a83ff" stop-opacity=".23"/><stop offset="1" stop-color="#293b9b" stop-opacity="0"/></radialGradient><filter id="soft"><feGaussianBlur stdDeviation="5"/></filter></defs><circle cx="300" cy="300" r="210" fill="url(#core)"/><g id="brain-net"></g><g id="brain-nodes"></g><circle cx="300" cy="300" r="6" fill="#dbe9ff" opacity=".8"><animate attributeName="opacity" values=".4;.9;.4" dur="3s" repeatCount="indefinite"/></circle></svg></div>
 <div class="left-note"><b>NEURAL CORE</b><br>READ-ONLY VISUALIZATION<br><span id="brain-state">WAITING FOR MARKET DATA</span></div>
</section>
<section class="markets" id="markets" aria-label="实时市场行情">
 <article class="quote disconnected" data-symbol="BTC" style="--asset:#52bfff"><div class="quote-head"><span class="symbol">BTC</span><span class="quote-status">连接中</span></div><div class="price">—</div><div class="change">—</div><svg class="spark" viewBox="0 0 160 36" preserveAspectRatio="none"><path class="glow"></path><path class="line"></path></svg></article>
 <article class="quote disconnected" data-symbol="HYPE" style="--asset:#52bfff"><div class="quote-head"><span class="symbol">HYPE</span><span class="quote-status">连接中</span></div><div class="price">—</div><div class="change">—</div><svg class="spark" viewBox="0 0 160 36" preserveAspectRatio="none"><path class="glow"></path><path class="line"></path></svg></article>
 <article class="quote disconnected" data-symbol="XAU" style="--asset:#e6c47c"><div class="quote-head"><span class="symbol">XAU</span><span class="quote-status">未接入数据源</span></div><div class="price">—</div><div class="change">—</div><svg class="spark" viewBox="0 0 160 36" preserveAspectRatio="none"><path class="glow"></path><path class="line"></path></svg></article>
 <article class="quote disconnected" data-symbol="CL" style="--asset:#53e5b4"><div class="quote-head"><span class="symbol">CL</span><span class="quote-status">未接入数据源</span></div><div class="price">—</div><div class="change">—</div><svg class="spark" viewBox="0 0 160 36" preserveAspectRatio="none"><path class="glow"></path><path class="line"></path></svg></article>
 <article class="quote disconnected" data-symbol="NVDA" style="--asset:#b49aff"><div class="quote-head"><span class="symbol">NVDA</span><span class="quote-status">未接入数据源</span></div><div class="price">—</div><div class="change">—</div><svg class="spark" viewBox="0 0 160 36" preserveAspectRatio="none"><path class="glow"></path><path class="line"></path></svg></article>
 <article class="quote disconnected" data-symbol="TSLA" style="--asset:#b49aff"><div class="quote-head"><span class="symbol">TSLA</span><span class="quote-status">未接入数据源</span></div><div class="price">—</div><div class="change">—</div><svg class="spark" viewBox="0 0 160 36" preserveAspectRatio="none"><path class="glow"></path><path class="line"></path></svg></article>
 <article class="quote disconnected" data-symbol="AAPL" style="--asset:#8beaff"><div class="quote-head"><span class="symbol">AAPL</span><span class="quote-status">未接入数据源</span></div><div class="price">—</div><div class="change">—</div><svg class="spark" viewBox="0 0 160 36" preserveAspectRatio="none"><path class="glow"></path><path class="line"></path></svg></article>
</section>
<footer><span>VEGAS OCTOPUS · BUILD 01</span><span id="updated">不展示模拟行情 / 不执行交易</span><span>iPAD · LANDSCAPE READY</span></footer>
</main>
<script>
(() => {
 const COLORS=["#52bfff","#b49aff","#8beaff","#e6c47c","#53e5b4"];
 const reduceMotion=matchMedia("(prefers-reduced-motion: reduce)").matches;
 // Build a layered neural network in the central square.
 const ns=document.getElementById("brain-net"), dots=document.getElementById("brain-nodes");
 const pts=[];
 for(let i=0;i<74;i++){const a=i*2.3999632297,r=55+Math.sqrt((i+.5)/74)*205;pts.push({x:300+Math.cos(a)*r*(.75+Math.random()*.24),y:300+Math.sin(a)*r*(.7+Math.random()*.25),z:Math.random(),p:Math.random()*6.28});}
 let lines="";
 pts.forEach((p,i)=>{const nearest=pts.map((q,j)=>({q,j,d:(p.x-q.x)**2+(p.y-q.y)**2})).filter(o=>o.j!==i).sort((a,b)=>a.d-b.d).slice(0,2);nearest.forEach(({q})=>{lines+=`<line x1="${p.x.toFixed(1)}" y1="${p.y.toFixed(1)}" x2="${q.x.toFixed(1)}" y2="${q.y.toFixed(1)}" stroke="${Math.random()>.72?"#8beaff":"#8795ff"}" stroke-opacity=".18" stroke-width=".8"/>`;});});
 ns.innerHTML=lines;
 dots.innerHTML=pts.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${(1+p.z*1.8).toFixed(1)}" fill="${p.z>.7?"#8beaff":"#a7b3ff"}" opacity=".45"><animate attributeName="opacity" values=".2;.85;.2" dur="${(2.8+p.z*4).toFixed(1)}s" begin="-${(p.p%5).toFixed(1)}s" repeatCount="indefinite"/></circle>`).join("");
 // Five translucent jellyfish, each with 10–12 flowing tendrils.
 const canvas=document.getElementById("space"),ctx=canvas.getContext("2d");
 const jellies=COLORS.map((color,i)=>({x:Math.random(),y:Math.random(),z:.45+Math.random()*.5,vx:(Math.random()-.5)*.00018,vy:(Math.random()-.5)*.00015,phase:Math.random()*7,color,target:null,i}));
 let w=0,h=0,dpr=1;
 function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;canvas.style.width=w+"px";canvas.style.height=h+"px";ctx.setTransform(dpr,0,0,dpr,0,0);}
 addEventListener("resize",resize,{passive:true});resize();
 const quotes={};
 function drawJelly(j,t){
   const x=j.x*w,y=j.y*h,s=(20+j.z*17),activity=Math.min(1,Math.abs(j.vx)+Math.abs(j.vy))*10000;
   ctx.save();ctx.translate(x,y);ctx.scale(j.z,j.z);ctx.globalAlpha=.46+j.z*.3;
   const g=ctx.createRadialGradient(-s*.25,-s*.35,1,0,0,s*1.25);g.addColorStop(0,"#ffffffc7");g.addColorStop(.18,j.color+"aa");g.addColorStop(.65,j.color+"55");g.addColorStop(1,j.color+"00");
   ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,0,s*1.05,s*.78+Math.sin(t*.001+j.phase)*2,0,Math.PI,Math.PI*2);ctx.bezierCurveTo(s,-s*.05,s*.6,s*.55,0,s*.65);ctx.bezierCurveTo(-s*.6,s*.55,-s,-s*.05,-s,-s*.05);ctx.fill();
   ctx.strokeStyle=j.color;ctx.lineWidth=1;ctx.globalAlpha=.28+j.z*.25;
   for(let k=0;k<11;k++){const a=Math.PI+(k/10)*Math.PI,baseX=Math.cos(a)*s*.75,baseY=Math.sin(a)*s*.15;ctx.beginPath();ctx.moveTo(baseX,baseY);for(let n=1;n<=8;n++){const f=n/8;ctx.lineTo(baseX+Math.sin(t*.0015+j.phase+k*.7+f*4)*s*.18*f,baseY+f*(s*1.25)+Math.cos(t*.001+j.phase+k)*s*.08*f);}ctx.stroke();ctx.beginPath();ctx.arc(baseX+Math.sin(t*.0015+j.phase+k*.7+4)*s*.18,baseY+s*1.25,1.2,0,Math.PI*2);ctx.fillStyle=j.color;ctx.fill();}
   ctx.restore();
 }
 let last=0;
 function animate(t){if(!reduceMotion||t-last>1000){ctx.clearRect(0,0,w,h);jellies.forEach(j=>{j.phase+=.0015;j.x+=j.vx;j.y+=j.vy;if(j.x<.03||j.x>.97)j.vx*=-1;if(j.y<.04||j.y>.96)j.vy*=-1;drawJelly(j,t);});last=t;}requestAnimationFrame(animate);}
 requestAnimationFrame(animate);
 const fmt=n=>n>=1000?n.toLocaleString("en-US",{maximumFractionDigits:2}):n>=1?n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:4}):n.toLocaleString("en-US",{maximumSignificantDigits:6});
 function pathFor(values){if(!values||values.length<2)return "";const lo=Math.min(...values),hi=Math.max(...values),range=hi-lo||1;return values.map((v,i)=>(i?"L":"M")+(i*160/(values.length-1)).toFixed(2)+" "+(32-(v-lo)/range*27).toFixed(2)).join(" ");}
 async function loadBitget(symbol){const url="https://api.bitget.com/api/v2/spot/market/candles?symbol="+symbol+"&granularity=15min&limit=60";const r=await fetch(url,{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);const j=await r.json();if(j.code!=="00000"||!Array.isArray(j.data)||!j.data.length)throw Error("No market data");const rows=j.data.slice().reverse();return {price:Number(rows.at(-1)[4]),open:Number(rows[0][1]),values:rows.map(x=>Number(x[4])),time:Number(rows.at(-1)[0])};}
 async function updateQuote(symbol,apiSymbol){const card=document.querySelector('[data-symbol="'+symbol+'"]');if(!card){console.warn("Missing quote card:",symbol);return false;}try{const q=await loadBitget(apiSymbol);if(!Number.isFinite(q.price)||q.price<=0)throw Error("Invalid price");const pct=(q.price/q.open-1)*100;card.querySelector(".price").textContent=fmt(q.price);card.querySelector(".change").textContent=(pct>=0?"+":"")+pct.toFixed(2)+"%";card.querySelector(".quote-status").textContent="BITGET · 15M";const p=pathFor(q.values);card.querySelector(".line").setAttribute("d",p);card.querySelector(".glow").setAttribute("d",p);card.classList.remove("disconnected");card.querySelector(".quote-status").style.color="#67dcb8";quotes[symbol]=q;return true;}catch(e){card.querySelector(".quote-status").textContent=quotes[symbol]?"数据中断 · 保留上次":"连接失败";card.classList.add("disconnected");return false;}}
 async function refresh(){const results=await Promise.all([updateQuote("BTC","BTCUSDT"),updateQuote("HYPE","HYPEUSDT")]);const ok=results.some(Boolean);document.getElementById("global-dot").classList.toggle("live",ok);document.getElementById("global-status").textContent=ok?"公开行情已连接":"行情连接异常";document.getElementById("updated").textContent="最近检查 "+new Date().toLocaleTimeString()+" · 仅公开行情";document.getElementById("brain-state").textContent=ok?"MARKET DATA RECEIVED":"WAITING FOR MARKET DATA";}
 refresh();setInterval(refresh,15000);
})();
</script>
</body>
</html>
